name: Setup Node
description: Setup a Node environment with access to a private registry

inputs:
  cache:
    description: 'Used to specify a package manager for caching in the default directory. Supported values: npm, yarn, pnpm'
    required: false
  node-version:
    description: 'Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0'
    required: false
  private-server-base:
    description: 'Base url for pointing to private npm repositories'
    required: true
  private-npm-registry:
    description: 'Relative URL of the private NPM registry to use'
    required: true
  private-npm-token:
    description: 'Token for authenticating to the private NPM registry'
    required: true
  scope:
    description: 'Scope to use for the private NPM registry.'
    required: true

runs:
  using: composite
  steps:
    - name: Configure Node
      uses: Th3-Hero/github-workflows-and-actions/default-setup-node@main
      with:
        cache: ${{ inputs.cache }}
        node-version: ${{ inputs.node-version }}
    - name: Generate npmrc
      shell: bash
      run: |
        PREFIX="https:"
        REGISTRY="${{ inputs.private-server-base }}/${{ inputs.private-npm-registry }}"
        
        cat <<EOF > ${HOME}/.npmrc
        ${{ inputs.scope }}:registry=${REGISTRY}
        ${REGISTRY#"$PREFIX"}:_authToken=${{ inputs.private-npm-token }}
        EOF
