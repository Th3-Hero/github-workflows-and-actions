name: Eslint

on:
  workflow_call:
    inputs:
      node-version:
        description: 'The Node.js version to use.'
        required: true
        type: string
      package-manager:
        description: 'The package manager to use (npm, yarn or pnpm).'
        required: true
        type: string

jobs:
  lint:
    name: Eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: Th3-Hero/github-workflows-and-actions/checkout@main

      - name: Setup Node.js
        uses: Th3-Hero/github-workflows-and-actions/default-setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Fail if unsupported package manager
        if: ${{ inputs.package-manager != 'npm' && inputs.package-manager != 'yarn' && inputs.package-manager != 'pnpm' }}
        run: |
          echo "Unsupported package manager: ${{ inputs.package-manager }}"
          exit 1

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: yarn install --frozen-lockfile

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Run ESLint (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npx eslint .

      - name: Run ESLint (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        run: yarn eslint .

      - name: Run ESLint (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm exec eslint .
